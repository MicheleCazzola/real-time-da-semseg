path:
  root: "data/loveda"
  output_dir: "temp"
  train_dir: "Train"
  val_dir: "Val"
  source: "Urban"
  target: "Urban"
  images: "images_png"
  masks: "masks_png"
  checkpoints: "models/checkpoints"
  weights: "models/pretrained_weights"

data:
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]
  batch_size: 6
  dimensions:
    height: 1024
    width: 1024
  resize:
    height: 512
    width: 512
  augment: false

model:
  model: "bisenet_v1_rt"
  checkpoint: null
  ignore_index: -1
  num_classes: 7

training:
  train: true
  evaluate: true
  measure: false
  resume: false
  adaptation: false
  epochs: 20
  criterion: "cross_entropy"
  loss_weights: null
  optimizer: "AdamW"
  scheduler: "poly"
  power: 0.9
  eta_min: 1.e-6
  learning_rate: 1.e-4
  weight_decay: 1.e-4
  step_size: 10
  gamma: 0.1
  momentum: 0.9